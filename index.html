<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Today · CampusFlow</title>
  <meta name="description" content="CampusFlow — live timetable, academic calendar and course hub.">

  <meta name="theme-color" content="#16233b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CampusFlow">

  <link id="manifestLink" rel="manifest" href="#">
  <link id="favLink" rel="icon" href="./icon.png" type="image/png">
  <link rel="apple-touch-icon" href="./icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;600&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg style="display:none" aria-hidden="true"><symbol id="logo-glyph" viewBox="0 0 64 64"><circle cx="32" cy="32" r="32" fill="#16233b" /><g fill="#f0a41c"><rect x="14" y="15" width="10" height="10" rx="3" /><rect x="27" y="15" width="10" height="10" rx="3" opacity=".4" /><rect x="40" y="15" width="10" height="10" rx="3" /><rect x="14" y="28" width="23" height="10" rx="3" /><rect x="40" y="28" width="10" height="10" rx="3" opacity=".4" /><rect x="14" y="41" width="10" height="10" rx="3" opacity=".4" /><rect x="27" y="41" width="23" height="10" rx="3" /></g></symbol></svg>
<div id="splash" aria-hidden="true">
<div class="sp-inner">
<svg class="sp-logo" viewBox="0 0 64 64" aria-hidden="true"><use href="#logo-glyph" /><circle cx="32" cy="32" r="30.5" fill="none" stroke="rgba(240,164,28,.35)" stroke-width="1.5" /></svg>
<div class="sp-name">CampusFlow</div>
<div class="sp-sub" id="spSub">Loading...</div>
<div class="sp-dots"><i></i><i></i><i></i></div>
</div>
</div>
<a class="skip" href="#main">Skip to content</a>
<div class="shell">
<aside class="sidebar" aria-label="Primary">
<div class="brand">
<svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><use href="#logo-glyph" /></svg>
<div>CampusFlow<small id="brandSub"></small></div>
</div>
<button class="side-toggle" id="sideToggle" aria-label="Collapse sidebar" title="Collapse sidebar ( [ )">
<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
</button>
<nav class="side-nav" id="sideNav"></nav>
<div class="side-foot">
<div class="side-card" id="sideRing"></div>

<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 21h16" /></svg>
<span class="nav-lb">Install app</span>
</button>
</div>
</aside>
<div class="main">
<main class="content" id="main">
<section class="view" id="view-today" aria-label="Today"></section>
<section class="view" id="view-timetable" aria-label="Timetable"></section>
<section class="view" id="view-calendar" aria-label="Academic calendar"></section>
<section class="view" id="view-courses" aria-label="Courses"></section>
</main>
</div>
</div>

<nav class="bottombar" id="bottomNav" aria-label="Primary"></nav>
<button class="fab" id="searchBtn" aria-label="Search courses, events, rooms">
<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="M21 21l-4.3-4.3" /></svg>
</button>

<div class="ov" id="ov" hidden><div class="modal" id="modalBox" role="dialog" aria-modal="true"></div></div>

<input id="palInput" type="text" placeholder="Search courses, events, faculty, rooms…" autocomplete="off">
</div>
<div class="pal-list" id="palList"></div>

</div>
</div>

<div id="liveAnnouncer" class="sr-only" aria-live="polite" aria-atomic="true"></div>

<script>
'use strict';

fetch('bundle.json')
  .then(res => {
    if (!res.ok) throw new Error('Network response was not ok');
    return res.json();
  })
  .then(bundle => {
    const DATA = bundle.data;
    const MANIFEST_CONFIG = bundle.manifestConfig;

    // ====== APP INITIALIZATION ======
    const $ = (s, c = document) => c.querySelector(s);
    const $$ = (s, c = document) => c.querySelectorAll(s);
    const pad = n => String(n).padStart(2, '0');
    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
    const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','"':'&quot;'}[c]));
    const day0 = (d = new Date()) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
    const diffDays = (a, b) => Math.round((Date.UTC(a.getFullYear(), a.getMonth(), a.getDate()) - Date.UTC(b.getFullYear(), b.getMonth(), b.getDate())) / 864e5);
    const mer = m => m < 720 ? 'am' : 'pm';
    const h12 = m => `${Math.floor(m / 60) % 12 || 12}:${pad(m % 60)}`;
    const fmtMin = (m, compact) => `${h12(m)}${compact ? (m < 720 ? 'a' : 'p') : ' ' + mer(m)}`;
    const fmtRange = (a, b) => mer(a) === mer(b) ? `${h12(a)}–${h12(b)} ${mer(b)}` : `${h12(a)} ${mer(a)} – ${h12(b)} ${mer(b)}`;
    const fmtDur = min => {
      min = Math.max(0, Math.round(min));
      const h = Math.floor(min / 60), m = min % 60;
      return h ? `${h}h ${pad(m)}m` : `${m}m`;
    };
    const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const MON3 = MONTHS.map(m => m.slice(0, 3));
    const MONTH_IDX = Object.fromEntries(MON3.map((m, i) => [m, i]));
    const DOW = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const DOW3 = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const DOW_SHORT = {Sunday:'Sun',Monday:'Mon',Tuesday:'Tue',Wednesday:'Wed',Thursday:'Thu',Friday:'Fri',Saturday:'Sat'};
    const dow3 = d => DOW3[d.getDay()];
    const pDate = s => { if (!s) return new Date(0); const [d, m, y] = s.trim().split(/\s+/); return new Date(+y, MONTH_IDX[m], +d); };
    const dk = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
    const sameDay = (a, b) => a.toDateString() === b.toDateString();
    const fmtDay = d => `${pad(d.getDate())} ${MON3[d.getMonth()]}`;
    const fmtDayW = d => `${dow3(d)}, ${fmtDay(d)}`;
    const fmtDayFull = d => `${fmtDayW(d)} ${d.getFullYear()}`;
    const fmtFullDate = d => `${DOW[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}${d.getHours() || d.getMinutes() ? ' · ' + fmtMin(d.getHours() * 60 + d.getMinutes()) : ''}`;
    const currentMins = (now = new Date()) => now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;
    const pctOf = (s, mins) => (s && s.end > s.start) ? clamp(Math.floor((mins - s.start) / (s.end - s.start) * 100), 0, 99) : 0;
    const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
    const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    const IS_MOBILE = matchMedia('(pointer: coarse)').matches || matchMedia('(max-width: 768px)').matches;
    const META = DATA.meta || {};
    const SEM_LABEL = `${META.semester || 'Odd'} Semester ${META.year || '2026-27'}`;
    const CLASS_START = pDate(META.semStart || '03 Aug 2026');
    const LAST_DAY = pDate(META.semEnd || '07 Dec 2026');
    const RADAR_S = pDate(META.radarStart || '01 Jul 2026');
    const RADAR_E = pDate(META.radarEnd || '31 Jan 2027');
    const DEFAULT_ROOM = META.defaultRoom || 'E-306';
    const WORKING_SATS = META.workingSats || [2, 4];

    const CAT = {
      'Academic Activities':    { short: 'Academic', cls: 'academic',    col: 'var(--academic)',   bg: 'var(--theory-bg)' },
      'Examination Activities': { short: 'Exams',    cls: 'examination', col: 'var(--exam)',       bg: 'var(--exam-bg)' },
      'Exam Operations':        { short: 'Exam Ops', cls: 'examops',     col: 'var(--examops)',    bg: 'var(--examops-bg)' },
      'Holidays':               { short: 'Holidays', cls: 'holidays',    col: 'var(--holiday)',    bg: 'var(--holiday-bg)' },
      'Additional Activities':  { short: 'Extra',    cls: 'additional',  col: 'var(--additional)', bg: 'var(--accent-soft)' },
    };
    const CATS = Object.keys(CAT);
    const CAT_ORDER = ['Holidays', 'Examination Activities', 'Exam Operations', 'Academic Activities', 'Additional Activities'];
    const TYPE_INFO = {
      Theory:    { cls: 'theory',    var: 'var(--theory)',    fill: 'rgba(58,110,165,.28)' },
      Practical: { cls: 'practical', var: 'var(--practical)', fill: 'rgba(31,122,109,.28)' },
      Blended:   { cls: 'blended',   var: 'var(--blended)',   fill: 'rgba(123,82,174,.28)' },
    };
    const TYPES = Object.keys(TYPE_INFO);
    const typeInfo = t => TYPE_INFO[t] || TYPE_INFO.Theory;

    const ICONS = {
      clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>', pin: '<path d="M12 21s7-5.5 7-11a7 7 0 1 0-14 0c0 5.5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/>',
      cal: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/>', bolt: '<path d="M13 2L4 14h6l-1 8 9-12h-6z"/>',
      note: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>', sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9L17 7M6.3 17.7l-1.4 1.4"/>',
      check: '<circle cx="12" cy="12" r="9"/><path d="M8.5 12.4l2.4 2.4 4.8-4.8"/>', list: '<path d="M8.5 6h12M8.5 12h12M8.5 18h12"/><path d="M3.5 6h.5M3.5 12h.5M3.5 18h.5"/>',
      chart: '<path d="M3 20h18"/><path d="M6 20v-7M11 20V5M16 20v-10"/>', pulse: '<path d="M2 12h4l3-8 4 16 3-8h6"/>',
      utens: '<path d="M4 2v7a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M20 15V2a5 5 0 0 0-4 5v6a2 2 0 0 0 2 2h2z"/><path d="M20 15v7"/>',
      spark: '<path d="M12 3l2 5.4 5.5 1.6-5.5 2-2 5.4-2-5.4-5.5-2L10 8.4z"/><path d="M19 16l.8 2.2L22 19"/>',
      dl: '<path d="M12 3v12m0 0l-4-4m4 4l4-4M4 21h16"/>', chev: '<path d="M9 6l6 6-6 6"/>', x: '<path d="M6 6l12 12M18 6L6 18"/>',
      today: '<circle cx="12" cy="12" r="4.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/>',
      timetable: '<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M9 4v17M15 9v12"/>',
      calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18M8 14h3M8 17h6"/>',
      courses: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V4H6.5A2.5 2.5 0 0 0 4 6.5v13z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5M9 8h7"/>',
      more: '<path d="M4 7h10M18 7h2M4 12h4M12 12h8M4 17h13M20 17h.5"/><circle cx="16" cy="7" r="2"/><circle cx="9.5" cy="12" r="2"/><circle cx="18.5" cy="17" r="2"/>',
    };
    const svg = (n, attrs) => `<svg ${attrs} aria-hidden="true">${ICONS[n] || ''}</svg>`;
    const I = (n, s = 14, nav = false) => svg(n, `${nav ? '' : `width="${s}" height="${s}" `}viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"`);
    const navSVG = n => I(n, 0, true);
    const a = (act, val = '') => `data-a="${act}"${val ? ` data-v="${esc(val)}"` : ''}`;
    const btn = (html, act, val = '', cls = 'btn', attrs = '') => `<button class="${cls}" ${a(act, val)} ${attrs}>${html}</button>`;
    const cardH = (ic, title, extra = '') => `<div class="card-h">${I(ic)} ${title}${extra}</div>`;
    const modalHead = (mc, inner) => `<div class="modal-h"${mc ? ` style="--mc:${mc}"` : ''}><div>${inner}</div>${btn(I('x', 18), 'close', '', 'iconbtn x', 'aria-label="Close"')}</div>`;
    const count = (html, cls = '') => `<span class="count ${cls}">${html}</span>`;
    const toggleSet = (set, val) => set.has(val) ? set.delete(val) : set.add(val);

    // Cache frequently accessed DOM elements
    const DOM = {
      modal: $('#modalBox'), ov: $('#ov'), pal: $('#palOv'), palIn: $('#palInput'), palList: $('#palList'),
      toast: $('#toast'), splash: $('#splash'), sideNav: $('#sideNav'), bottomNav: $('#bottomNav'),
      sideRing: $('#sideRing'), sideToggle: $('#sideToggle'), installBtn: $('#installBtn'), searchBtn: $('#searchBtn'),
      views: { today: $('#view-today'), timetable: $('#view-timetable'), calendar: $('#view-calendar'), courses: $('#view-courses') },
    };

    const P_START = (() => { const [h, m] = DATA.timetable.periods.start.split(':').map(Number); return h * 60 + m; })();
    const PERIODS = (() => {
      let t = P_START;
      return DATA.timetable.periods.durations.map((dur, i) => {
        const label = DATA.timetable.periods.labels[i];
        const p = { label, dur, start: t, end: t + dur, lunch: label === 'lunch' };
        t += dur; return p;
      });
    })();
    const P_BY_LABEL = Object.fromEntries(PERIODS.map(p => [p.label, p]));
    const LAST_END = PERIODS.at(-1).end;
    const LUNCH = P_BY_LABEL.lunch || { start: Infinity, end: Infinity, label: 'lunch', dur: 0 };
    const norm = s => String(s).replace(/\s+/g, '');
    const COURSES = Object.fromEntries(DATA.timetable.courses.map(c => {
      const key = norm(c.abbr || c.code);
      return [key, { ...c, key, meet: [], room: c.room }];
    }));
    const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday'];
    const SESSIONS = Object.fromEntries(DAYS.map(day => {
      const sessions = (DATA.timetable.schedule[day] || []).map(e => {
        const first = P_BY_LABEL[e.periods[0]], last = P_BY_LABEL[e.periods.at(-1)];
        return { day, periods: e.periods, start: first.start, end: last.end, course: COURSES[norm(e.course)], span: e.periods.length };
      }).sort((a, b) => a.start - b.start);
      sessions.forEach(s => s.course?.meet.push({ day, periods: s.periods, start: s.start, end: s.end }));
      return [day, sessions];
    }));
    Object.values(COURSES).forEach(c => { if (!c.room && c.meet.length && !c.editable) c.room = DEFAULT_ROOM; });
    const isExamOps = e => e.cat === 'Examination Activities' && /Evaluation|Grievance|Uploading|Detention|Result Publication/i.test(e.event);
    const EVENTS = DATA.academic_calendar.events.map((e, i) => {
      const s = pDate(e.date || e.start), en = pDate(e.date || e.end);
      return { ...e, cat: isExamOps(e) ? 'Exam Operations' : e.cat, i, s, en, sk: dk(s), ek: dk(en) };
    }).sort((a, b) => a.s - b.s || a.en - b.en);
    const dateRange = (s, en) => { const r = []; for (let d = new Date(s); d <= en; d.setDate(d.getDate() + 1)) r.push(dk(d)); return r; };
    const HOLIDAYS = new Set(EVENTS.filter(e => e.cat === 'Holidays').flatMap(e => dateRange(e.s, e.en)));
    const EXAMDAYS = new Set(EVENTS.filter(e => e.cat === 'Examination Activities').flatMap(e => dateRange(e.s, e.en)));
    const EVENTS_BY_DATE = {};
    EVENTS.forEach(e => {
      let d = new Date(e.s);
      while (d <= e.en) {
        (EVENTS_BY_DATE[dk(d)] ||= []).push(e);
        d.setDate(d.getDate() + 1);
      }
    });
    const SPAN_SLOT = (() => {
      const end = [-Infinity, -Infinity], map = {};
      EVENTS.filter(e => e.en > e.s && e.cat !== 'Examination Activities').forEach(e => {
        const slot = end[0] < e.s ? 0 : end[1] < e.s ? 1 : (end[0] <= end[1] ? 0 : 1);
        map[e.i] = slot; end[slot] = e.en;
      });
      return map;
    })();
    const isWorkingSat = d => d.getDay() === 6 && WORKING_SATS.includes(Math.ceil(d.getDate() / 7));
    const isAcademicDay = d => d.getDay() !== 0 && !HOLIDAYS.has(dk(d)) && (d.getDay() !== 6 || isWorkingSat(d));
    const OV = Object.fromEntries((DATA.dayOverrides || []).map(o => [dk(pDate(o.date)), { ...o, d: pDate(o.date) }]));
    const ovOn = d => OV[dk(d)];
    const ovLabel = o => o.status === 'working' ? `Teaching day · ${DOW_SHORT[o.follows] || o.follows} timetable` : 'University closed';
    const sessionsForDate = d => {
      const o = ovOn(d);
      return o?.status === 'closed' ? [] : SESSIONS[o?.status === 'working' ? o.follows : DOW[d.getDay()]] || [];
    };
    const isTeachingDay = d => { const o = ovOn(d); return o ? o.status === 'working' : isAcademicDay(d); };
    const ACADEMIC_DAYS = [];
    for (let d = new Date(CLASS_START); d <= LAST_DAY; d.setDate(d.getDate() + 1)) { if (isAcademicDay(d)) ACADEMIC_DAYS.push(new Date(d)); }
    const SEM_TOTAL = ACADEMIC_DAYS.length || 90;
    const SEM_WEEKS = Math.ceil(SEM_TOTAL / 5);

    const getInitialPE = () => {
      try {
        const raw = JSON.parse(localStorage.getItem('cf-pe') || 'null');
        if (!raw) return {};
        if (raw.name !== undefined || raw.faculty !== undefined || raw.room !== undefined) {
          return { PE: raw };
        }
        return raw;
      } catch (_) {
        return {};
      }
    };

    const state = {
      tab: 'today',
      pe: getInitialPE(),
      calMonth: new Date(new Date().getFullYear(), new Date().getMonth(), 1),
      calSel: dk(new Date()), calFilters: new Set(CATS), ttTypes: new Set(TYPES),
      ttDay: (() => { const d = DOW[new Date().getDay()]; return DAYS.includes(d) ? d : 'Monday'; })(),
      courseFilter: 'All', palIdx: 0, palResults: [],
    };
    let deferredPrompt = null;
    function applyEditable() {
      Object.values(COURSES).forEach(c => {
        if (!c.editable || !state.pe[c.key]) return;
        ['room', 'faculty', 'name'].forEach(k => {
          const v = state.pe[c.key][k]?.trim();
          if (v) c[k] = v; else if (k === 'room') delete c.room;
        });
      });
    }
    applyEditable();

    const GLYPH_RECTS = [[14,15,10,10,1],[27,15,10,10,.4],[40,15,10,10,1],[14,28,23,10,1],[40,28,10,10,.4],[14,41,10,10,.4],[27,41,23,10,1]];
    function drawGlyph(ctx, f, ox, oy) {
      ctx.fillStyle = '#f0a41c';
      GLYPH_RECTS.forEach(([x, y, w, h, a]) => {
        ctx.globalAlpha = a;
        const X = ox + x * f, Y = oy + y * f, W = w * f, H = h * f, R = 3 * f;
        ctx.roundRect ? (ctx.beginPath(), ctx.roundRect(X, Y, W, H, R), ctx.fill()) : ctx.fillRect(X, Y, W, H);
      });
      ctx.globalAlpha = 1;
    }
    const favLink = $('#favLink');
    let lastFavKey = '';
    function paintFavicon(pct) {
      const key = pct == null ? 'logo' : `p${pct.toFixed(2)}`;
      if (key === lastFavKey) return;
      lastFavKey = key;
      try {
        const c = document.createElement('canvas'); c.width = c.height = 64;
        const ctx = c.getContext('2d');
        ctx.beginPath(); ctx.arc(32, 32, 32, 0, Math.PI * 2); ctx.fillStyle = '#16233b'; ctx.fill();
        if (pct == null) drawGlyph(ctx, 1, 0, 0);
        else {
          ctx.save(); ctx.globalAlpha = .45; drawGlyph(ctx, 1, 0, 0); ctx.restore();
          ctx.beginPath(); ctx.arc(32, 32, 29, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * clamp(pct, 0, 1));
          ctx.strokeStyle = '#f0a41c'; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.stroke();
        }
        favLink.href = c.toDataURL('image/png');
      } catch (_) {}
    }
    const paintLiveFavicon = () => { const st = getStatus(); paintFavicon(st.current ? pctOf(st.current, st.mins) : null); };
    const iconPNG = (size, maskable) => {
      const c = document.createElement('canvas'); c.width = c.height = size;
      const x = c.getContext('2d');
      if (maskable) { x.fillStyle = '#16233b'; x.fillRect(0, 0, size, size); drawGlyph(x, size * .52 / 64, size * .24, size * .24); }
      else { x.beginPath(); x.arc(size / 2, size / 2, size * 0.48, 0, Math.PI * 2); x.fillStyle = '#16233b'; x.fill(); drawGlyph(x, size * 0.85 / 64, size * 0.075, size * 0.075); }

    function trapFocus(e, container) {
      if (e.key !== 'Tab') return;
      const focusables = Array.from(container.querySelectorAll(
        'button:not([disabled]):not([hidden]), [href], input:not([disabled]):not([hidden]), select:not([disabled]):not([hidden]), textarea:not([disabled]):not([hidden]), [tabindex]:not([tabindex="-1"])'
      )).filter(el => el.offsetParent !== null || getComputedStyle(el).visibility !== 'hidden');
      if (!focusables.length) { e.preventDefault(); return; }
      const first = focusables[0];
      const last = focusables[focusables.length - 1];
      if (e.shiftKey) {
        if (document.activeElement === first || !container.contains(document.activeElement)) {
          e.preventDefault();
          last.focus();
        }
      } else {
        if (document.activeElement === last || !container.contains(document.activeElement)) {
          e.preventDefault();
          first.focus();
        }
      }
    }

        ? INDEX.filter(x => x.w.includes(q)).sort((a, b) => b.tl.startsWith(q) - a.tl.startsWith(q)).slice(0, 9)

      $$('.view').forEach(v => v.classList.remove('active'));
      DOM.views[t]?.classList.add('active');
      $$('[data-a="tab"]').forEach(b => b.classList.toggle('on', b.dataset.v === t));
      document.title = TAB_TITLES[t] || 'CampusFlow';
      window.scrollTo({ top: 0, behavior: 'auto' });
      renderActive();
    }
    const actions = {
      tab: setTab,
      goto: setTab,
      settings: openSettings,
      tttype: v => { toggleSet(state.ttTypes, v); renderTimetable(); },
      ttday: v => { state.ttDay = v; renderTimetable(); },
      cfilter: v => { state.courseFilter = v; renderCourses(); },
      calcat: v => { toggleSet(state.calFilters, v); renderCalendar(); },
      cald: v => { state.calSel = v; renderCalendar(); },
      calPrev: () => {
        const d = new Date(state.calMonth); d.setMonth(d.getMonth() - 1); state.calMonth = d;
        const pre = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
        if (!state.calSel.startsWith(pre)) state.calSel = dk(new Date(d.getFullYear(), d.getMonth(), 1));
        renderCalendar();
      },
      calNext: () => {
        const d = new Date(state.calMonth); d.setMonth(d.getMonth() + 1); state.calMonth = d;
        const pre = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
        const now = new Date();
        state.calSel = (now.getFullYear() === d.getFullYear() && now.getMonth() === d.getMonth())
          ? dk(now)
          : (state.calSel.startsWith(pre) ? state.calSel : dk(new Date(d.getFullYear(), d.getMonth(), 1)));
        renderCalendar();
      },
      event: v => openEvent(+v),
      course: v => v && openCourse(v),
      ovopen: v => openOverride(v),
      ovcal: v => {
        const [yy, mm, dd] = v.split('-').map(Number);
        state.calMonth = new Date(yy, mm - 1, 1);
        state.calSel = v;
        closeModal();
        setTab('calendar');
      },
      'pe-save': () => {
        const key = state._lastEditedKey || 'PE';
        state.pe[key] = {
          name: $('#peName')?.value || '',
          faculty: $('#peFac')?.value || '',
          room: $('#peRoom')?.value || ''
        };
        localStorage.setItem('cf-pe', JSON.stringify(state.pe));
        applyEditable();
        buildIndex();
        openCourse(key);
        renderActive();
        toast('Saved.');
      },
      monthof: v => {
        const ev = EVENTS[+v];
        state.calMonth = new Date(ev.s.getFullYear(), ev.s.getMonth(), 1);
        state.calSel = dk(ev.s);
        closeModal();
        setTab('calendar');
      },
      showtt: v => {
        const c = COURSES[v];
        if (c?.meet.length) state.ttDay = c.meet[0].day;
        closeModal();
        setTab('timetable');
        setTimeout(() => {
          const cell = $(`.tt td[data-v="${v}"]`);
          if (cell) { cell.classList.add('flash'); cell.scrollIntoView({ block: 'center', behavior: 'smooth' }); setTimeout(() => cell.classList.remove('flash'), 2600); }
        }, 80);
      },
      close: () => closeModal(),
      pal: v => { closePalette(); state.palResults[+v]?.go(); },
      'mib-close': (v, el) => el.closest('.mib')?.remove(),
      install: () => doInstall(),
    };

    document.addEventListener('click', e => {
      const T = e.target;
      const el = T.closest('[data-a]');
      if (el) {
        const action = el.dataset.a;
        const val = el.dataset.v;
        if (actions[action]) actions[action](val, el);
        return;
      }
      if (T.id === 'ov') closeModal();
      if (T.id === 'palOv') closePalette();
    });
    document.addEventListener('keydown', e => {
      const k = e.key, mod = e.metaKey || e.ctrlKey;
      if (!DOM.ov.hidden && k === 'Tab') { trapFocus(e, DOM.modal); return; }
      if (!DOM.pal.hidden && k === 'Tab') { trapFocus(e, DOM.pal); return; }
      if (mod && k.toLowerCase() === 'k') { e.preventDefault(); DOM.pal.hidden ? openPalette() : closePalette(); return; }
      if (k === 'Escape') { closeModal(); closePalette(); return; }
      const tag = document.activeElement?.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      if (!mod && !e.altKey) {
        if (k === '[' && window.innerWidth >= 920) return setSide(!document.body.classList.contains('side-min'));
        if (['1', '2', '3', '4'].includes(k)) setTab(TABS[+k - 1][0]);
      }
    });
    DOM.searchBtn.addEventListener('click', openPalette);

    const sideToggle = DOM.sideToggle;
    function setSide(min) {
      document.body.classList.toggle('side-min', min);
      try { localStorage.setItem('cf-side-min', min ? '1' : '0'); } catch (_) {}
      const lb = min ? 'Expand sidebar' : 'Collapse sidebar';
      sideToggle.setAttribute('aria-label', lb);
      sideToggle.title = `${lb} ( [ )`;
    }
    sideToggle?.addEventListener('click', e => { setSide(!document.body.classList.contains('side-min')); if (e.detail) e.currentTarget.blur(); });
    if (localStorage.getItem('cf-side-min') === '1') setSide(true);

    const statusPhaseSig = st => `${st.off ? 'off' : 'on'}_${st.current ? st.current.start + '-' + st.current.end : 'none'}_${st.isLunch ? 'lunch' : ''}_${st.next ? st.next.start : 'none'}`;

    function updateTodayLive() {
      const now = new Date(), st = getStatus(now);
      const phase = statusPhaseSig(st);
      if (phase !== state._lastTodayPhase) {
        state._lastTodayPhase = phase;
        renderToday();
        if (st.current) announceStatus(`${st.current.course?.name || st.current.course?.abbr || 'Class'} in session until ${fmtMin(st.current.end)}`);
        else if (st.isLunch) announceStatus('Lunch break has started');
        else if (st.next) announceStatus(`Next class is ${st.next.course?.name || st.next.course?.abbr} at ${fmtMin(st.next.start)}`);
        return;
      }
      const view = DOM.views.today;
      if (!view || !view.classList.contains('active')) return;

      if (st.current) {
        const pct = pctOf(st.current, st.mins);
        const fill = view.querySelector('.now-fill');
        if (fill) { fill.style.width = `${pct}%`; fill.setAttribute('aria-valuenow', pct); }
        const left = view.querySelector('.now-left');
        if (left) left.textContent = `${fmtDur(st.current.end - st.mins)} left`;
        const pctEl = view.querySelector('.now-pct');
        if (pctEl) pctEl.textContent = `${pct}%`;
      } else if (st.isLunch) {
        const pct = pctOf(LUNCH, st.mins);
        const fill = view.querySelector('.now-fill');
        if (fill) fill.style.width = `${pct}%`;
        const title = view.querySelector('.now-title');
        if (title) title.textContent = `Back in ${fmtDur(LUNCH.end - st.mins)}`;
        const pctEl = view.querySelector('.now-pct');
        if (pctEl) pctEl.textContent = `${pct}%`;
      }

      const liveCount = view.querySelector('.tl-row.live .count');
      if (liveCount && st.current) {
        liveCount.textContent = `${pctOf(st.current, st.mins)}%`;
      }
    }

    function updateTimetableLive() {
      const now = new Date(), st = getStatus(now);
      const phase = `${st.eff_day}_${st.current ? st.current.start : 'none'}`;
      if (phase !== state._lastTTPhase) {
        state._lastTTPhase = phase;
        const ttEl = $('.tt-scroll'), ttScroll = ttEl?.scrollLeft ?? 0;
        renderTimetable();
        if (ttEl) ttEl.scrollLeft = ttScroll;
        return;
      }
      const liveCell = $('#view-timetable .tt-cell.live');
      if (liveCell && st.current) {
        const pct = pctOf(st.current, st.mins);
        const c = st.current.course || {};
        liveCell.style.backgroundImage = `linear-gradient(90deg, ${typeInfo(c.type).fill} ${pct}%, transparent ${pct}%)`;
      }
      const liveCount = $('#view-timetable .tl-row.live .count');
      if (liveCount && st.current) {
        liveCount.textContent = `${pctOf(st.current, st.mins)}%`;
      }
    }

    function renderSideRing() {
      if (!DOM.sideRing) return;
      const di = dayInfo(new Date());
      DOM.sideRing.innerHTML = `${ringSVG(di.idx / SEM_TOTAL, 46)}<div><div class="lbl">Semester progress</div><b>${di.idx}/${SEM_TOTAL} days</b></div>`;
    }

    setInterval(() => {
      renderSideRing();
      paintLiveFavicon();
      if (DOM.ov.hidden && DOM.pal.hidden) {
        if (state.tab === 'today') updateTodayLive();
        else if (state.tab === 'timetable') updateTimetableLive();
      }
    }, 15000);
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) {
        paintLiveFavicon();
        if (state.tab === 'today') updateTodayLive();
        else if (state.tab === 'timetable') updateTimetableLive();
      }
    });

    const spSub = $('#spSub'); if (spSub) spSub.textContent = SEM_LABEL;
    const brandSub = $('#brandSub'); if (brandSub) brandSub.textContent = SEM_LABEL;
    $('meta[name="description"]').setAttribute('content', `CampusFlow — live timetable, academic calendar and course hub for ${SEM_LABEL}.`);
    $('meta[name="apple-mobile-web-app-title"]').setAttribute('content', `CampusFlow ${META.year || ''}`.trim());

    const badRefs = Object.entries(DATA.timetable.schedule || {}).flatMap(([day, s]) =>
      s.filter(x => !COURSES[norm(x.course)]).map(x => `${day}: "${x.course}"`)
    );
    if (badRefs.length) console.warn('Schedule references missing courses:', badRefs);

    buildNav(); renderSideRing(); paintLiveFavicon();
    const initial = location.hash.replace('#', '');
    setTab(TABS.some(t => t[0] === initial) ? initial : 'today');
    if (!localStorage.getItem('cf-welcomed')) {
      localStorage.setItem('cf-welcomed', '1');
      setTimeout(() => toast('Welcome to CampusFlow — tap search to find anything.'), 1400);
    }
    const dismissSplash = () => { const s = $('#splash'); if (!s || s.classList.contains('done')) return; s.classList.add('done'); setTimeout(() => { try { s.remove(); } catch (_) { s.parentNode?.removeChild(s); } }, 350); };
    setTimeout(dismissSplash, isStandalone() ? 120 : 450);
  })
  .catch(err => {
    console.error("Failed to load app bundle:", err);
    const spSub = document.getElementById('spSub');
    if (spSub) spSub.textContent = 'Offline or failed to load data.';
  });
</script>
</body>
</html>
